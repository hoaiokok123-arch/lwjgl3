name: Android build

on:
  workflow_dispatch:
    inputs:
      lwjgl_version:
        description: "LWJGL version to package (e.g. 3.4.1). Must match source unless ALLOW_VERSION_MISMATCH=1."
        required: false
        default: "3.4.1"
      allow_version_mismatch:
        description: "Set to 1 to force build.type with lwjgl_version even when source version differs."
        required: false
        default: "0"
  push:

jobs:
  build:
    strategy:
      matrix:
        arch: [ "arm64", "arm32", "x86", "x64" ]
      fail-fast: false

    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: |
            8
            21

    - name: Build for Android ${{matrix.arch}}
      run: |
        JAVA8_VAR="JAVA_HOME_8_${{runner.arch}}"
        JAVA21_VAR="JAVA_HOME_21_${{runner.arch}}"
        export JAVA8_HOME="${!JAVA8_VAR}"

        export LWJGL_BUILD_ARCH=${{matrix.arch}}
        export LWJGL_VERSION="${{ github.event.inputs.lwjgl_version }}"
        if [ -z "$LWJGL_VERSION" ]; then
          export LWJGL_VERSION="$(grep -m1 '^lwjglVersion=' gradle.properties | cut -d'=' -f2)"
        fi

        if [[ "$LWJGL_VERSION" == 3.3.3* ]]; then
          export JAVA_HOME="$JAVA8_HOME"
        else
          export JAVA_HOME="${!JAVA21_VAR}"
        fi
        if [ -z "$JAVA_HOME" ]; then
          echo "Error: JAVA_HOME is empty for runner arch ${{runner.arch}}"
          exit 1
        fi
        export PATH="$JAVA_HOME/bin:$PATH"

        export ALLOW_VERSION_MISMATCH="${{ github.event.inputs.allow_version_mismatch }}"
        echo "Building LWJGL_VERSION=$LWJGL_VERSION for arch=$LWJGL_BUILD_ARCH with JAVA_HOME=$JAVA_HOME"
        set +e
        bash ci_build_android.bash 2>&1 | tee android-build-${{matrix.arch}}.log
        BUILD_STATUS=${PIPESTATUS[0]}
        set -e
        if [ "$BUILD_STATUS" -ne 0 ]; then
          TAIL_LOG="$(tail -n 60 android-build-${{matrix.arch}}.log | sed ':a;N;$!ba;s/\n/ | /g')"
          # Escape GitHub workflow command characters.
          TAIL_LOG="${TAIL_LOG//'%'/'%25'}"
          TAIL_LOG="${TAIL_LOG//$'\r'/'%0D'}"
          TAIL_LOG="${TAIL_LOG//$'\n'/'%0A'}"
          echo "::error title=Android build failed (${{matrix.arch}})::${TAIL_LOG}"
          {
            echo "## Android build failed (${{matrix.arch}})"
            echo ""
            echo "Last 120 lines of ci_build_android.bash output:"
            echo ""
            echo '```text'
            tail -n 120 android-build-${{matrix.arch}}.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$BUILD_STATUS"
        fi

    - name: Upload modules release output
      if: ${{matrix.arch == 'arm64'}} # Only upload this once
      uses: actions/upload-artifact@v4
      with:
        name: lwjgl3-android-modules
        path: bin/RELEASE

    - name: Upload native build output
      uses: actions/upload-artifact@v4
      with:
        name: lwjgl3-android-natives-${{matrix.arch}}
        path: bin/out

    - name: Upload Android build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lwjgl3-android-build-log-${{matrix.arch}}
        path: android-build-${{matrix.arch}}.log
