name: iOS build

on:
  workflow_dispatch:
    inputs:
      lwjgl_version:
        description: "LWJGL version to package (e.g. 3.4.1). Must match source unless ALLOW_VERSION_MISMATCH=1."
        required: false
        default: "3.4.1"
      allow_version_mismatch:
        description: "Set to 1 to force build.type with lwjgl_version even when source version differs."
        required: false
        default: "0"
  push:

jobs:
  build:
    runs-on: macos-14
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: |
            8
            21

    - name: Install dependencies
      run: |
        HOMEBREW_NO_AUTO_UPDATE=1 brew install autoconf automake libtool

    - name: Build with CI build script
      run: |
        JAVA8_VAR="JAVA_HOME_8_${{runner.arch}}"
        JAVA21_VAR="JAVA_HOME_21_${{runner.arch}}"
        export JAVA8_HOME="${!JAVA8_VAR}"

        export LWJGL_VERSION="${{ github.event.inputs.lwjgl_version }}"
        if [ -z "$LWJGL_VERSION" ]; then
          export LWJGL_VERSION="$(grep -m1 '^lwjglVersion=' gradle.properties | cut -d'=' -f2)"
        fi

        if [[ "$LWJGL_VERSION" == 3.3.3* ]]; then
          export JAVA_HOME="$JAVA8_HOME"
        else
          export JAVA_HOME="${!JAVA21_VAR}"
        fi
        if [ -z "$JAVA_HOME" ]; then
          echo "Error: JAVA_HOME is empty for runner arch ${{runner.arch}}"
          exit 1
        fi
        export PATH="$JAVA_HOME/bin:$PATH"

        export ALLOW_VERSION_MISMATCH="${{ github.event.inputs.allow_version_mismatch }}"
        echo "Building LWJGL_VERSION=$LWJGL_VERSION with JAVA_HOME=$JAVA_HOME"
        set +e
        bash ci_build_ios.bash 2>&1 | tee ios-build.log
        BUILD_STATUS=${PIPESTATUS[0]}
        set -e
        if [ "$BUILD_STATUS" -ne 0 ]; then
          TAIL_LOG="$(tail -n 60 ios-build.log | sed ':a;N;$!ba;s/\n/ | /g')"
          # Escape GitHub workflow command characters.
          TAIL_LOG="${TAIL_LOG//'%'/'%25'}"
          TAIL_LOG="${TAIL_LOG//$'\r'/'%0D'}"
          TAIL_LOG="${TAIL_LOG//$'\n'/'%0A'}"
          echo "::error title=iOS build failed::${TAIL_LOG}"
          {
            echo "## iOS build failed"
            echo ""
            echo "Last 120 lines of ci_build_ios.bash output:"
            echo ""
            echo '```text'
            tail -n 120 ios-build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$BUILD_STATUS"
        fi

    - name: Upload modules release output
      uses: actions/upload-artifact@v4
      with:
        name: lwjgl3-ios-modules
        path: bin/RELEASE

    - name: Upload native build output
      uses: actions/upload-artifact@v4
      with:
        name: lwjgl3-ios-natives
        path: bin/out

    - name: Upload iOS build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lwjgl3-ios-build-log
        path: ios-build.log
